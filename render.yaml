# Render Blueprint - lets Render auto-configure this service from one click
# (New -> Blueprint -> point at this repo)
services:
  - type: web
    name: rag-chatbot
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you paste this in the Render dashboard, not committed to git
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: PYTHON_VERSION
        value: 3.11.9
